name: CI

# Run the repo's three self-contained test suites on every push and PR.
# Each package is offline/deterministic (no API keys), so CI needs no secrets.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # BLAST backend: Express API, JWT auth, catalog + tiered checkout.
      - name: Backend — install & test
        working-directory: src/backend
        run: |
          npm ci
          npm test

      # MCP server: stdio server + sandbox smoke test.
      - name: MCP server — install & smoke test
        working-directory: mcp-server
        run: |
          npm ci
          npm run smoke

      # Agent: Hermes orchestrator + critic loop (no dependencies).
      - name: Agent — test
        working-directory: agent
        run: npm test
