name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Core + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspaces
        run: npm install
      - name: Run tests (packages/core + apps/api)
        run: npm test

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Root install first so the app can resolve @umhlabatea/core via the workspace.
      - name: Install workspaces
        run: npm install
      - name: Install mobile app
        working-directory: apps/mobile
        run: npm install
      - name: TypeScript check
        working-directory: apps/mobile
        run: npx tsc --noEmit
